[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "window-hash"
version = "0.1.3"
description = ""
authors = [{ name = "Chuancong Gao", email = "chuanconggao@users.noreply.github.com" }]
requires-python = ">=3.9"
readme = "README.md"

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ipykernel>=6.26.0",
    "mypy>=1.7.1",
    "flake8>=6.1.0",
]

[tool.coverage.run]
source = [
    "src",
]

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
    "C0103",
    "C0114",
    "C0115",
    "C0116",
]

[tool.pytest.ini_options]
addopts = "--cov --cov-report xml:cov.xml --cov-report html --cov-report term-missing"
pythonpath = [
    "src",
]
